<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة استطلاعات الرأي | Earn Tasks Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: linear-gradient(135deg, #0d6efd, #6610f2); color: white; padding: 50px 0; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">Earn<span class="text-white">Tasks Pro</span></a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="userBalanceContainer" style="display:none;">💰 رصيدك: <strong class="text-success" id="balanceVal">$0.00</strong></span>
                <button class="btn btn-outline-light btn-sm" id="authNavBtn" data-bs-toggle="modal" data-bs-target="#authModal">تسجيل الدخول</button>
            </div>
        </div>
    </nav>

    <div class="hero-section text-center">
        <div class="container">
            <h1 class="fw-bold mb-2">منصة استطلاعات الرأي والأرباح التلقائية</h1>
            <p class="lead mb-0">أكمل استطلاعات الرأي الحقيقية واكسب المال بكل سهولة وأمان.</p>
        </div>
    </div>

    <div class="container my-5">
        <!-- قسم شبكات العروض الحقيقية -->
        <div class="card p-5 text-center border-0 shadow-sm">
            <h3 class="fw-bold mb-3">استطلاعات الرأي الحقيقية (CPX Research)</h3>
            <p class="text-muted mb-4">اضغط على الزر أدناه لفتح صفحة الاستطلاعات والعروض في نافذة مستقلة ومباشرة للبدء في ربح الأموال.</p>
            
            <div>
                <button class="btn btn-primary btn-lg fw-bold px-5 py-3 shadow" onclick="openCPXResearch()">🚀 افتح استطلاعات CPX Research الآن</button>
            </div>
        </div>
    </div>

    <!-- Modal تسجيل الحساب -->
    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title fw-bold">تسجيل الدخول</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3"><label class="form-label">اسم المستخدم</label><input type="text" id="regUser" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">البريد الإلكتروني</label><input type="email" id="regEmail" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">كلمة السر</label><input type="password" id="regPass" class="form-control" required></div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">دخول / تسجيل</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://fpujbgygrnuqgdnrexcx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwdWpiZ3lncm51cWdkbnJleGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDA1MDUsImV4cCI6MjEwNzIxNjUwNX0.dmNknj6Sg3MTFGjAcyCHiPTyfTWVeyEPBgEe5oVZGGU";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem("currentUser") || null;

        document.addEventListener("DOMContentLoaded", function() {
            updateAuthUI();
        });

        async function updateAuthUI() {
            if (currentUser) {
                document.getElementById("authNavBtn").innerText = currentUser;
                document.getElementById("userBalanceContainer").style.display = "inline";
                const { data } = await supabaseClient.from("users").select("balance").eq("username", currentUser).single();
                if (data) {
                    document.getElementById("balanceVal").innerText = "$" + parseFloat(data.balance || 0).toFixed(2);
                }
            }
        }

        // تسجيل الدخول
        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const u = document.getElementById("regUser").value;
            const em = document.getElementById("regEmail").value;
            const p = document.getElementById("regPass").value;
            
            await supabaseClient.from("users").insert([{ username: u, email: em, password: p, balance: 0 }]);
            currentUser = u;
            localStorage.setItem("currentUser", u);
            updateAuthUI();
            bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
        });

        // فتح استطلاعات CPX Research بالدومين الصحيح
        function openCPXResearch() {
            const subId = currentUser || "guest_user";
            const appId = "37107";
            const userId = encodeURIComponent(subId);
            const url = `https://offers.cpx-research.com/index.php?app_id=${appId}&ext_user_id=${userId}&username=${userId}`;
            
            window.open(url, '_blank');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
